name: Contextes
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  APP_NAME: fastapi-starter

jobs:
  contextes:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher les valeurs de contexte
        run: |
          echo "Application : ${{ env.APP_NAME }}"
          echo "Acteur : ${{ github.actor }}"
          echo "Événement : ${{ github.event_name }}"
          echo "Branche : ${{ github.ref_name }}"
          echo "SHA du commit : ${{ github.sha }}"
          echo "OS du runner : ${{ runner.os }}"

      - name: Afficher le contexte github complet
        run: echo '${{ toJson(github) }}'
